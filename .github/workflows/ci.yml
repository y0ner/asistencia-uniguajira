name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      # sqflite_common_ffi necesita la biblioteca nativa de SQLite en Linux.
      - name: Instalar SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze --no-pub

      - name: Pruebas
        run: flutter test
