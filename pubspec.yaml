name: asistencia_uniguajira
description: "Registro y control de asistencia académica Offline-First de la Universidad de La Guajira."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Persistencia local Offline-First.
  sqflite: ^2.4.5
  path: ^1.9.1

  # Criptografía HMAC-SHA256.
  crypto: ^3.0.8

  # Bluetooth Low Energy: escaneo y emisión de paquetes.
  flutter_blue_plus: ^1.34.5
  flutter_ble_peripheral: ^3.2.0
  permission_handler: ^13.0.2

  # Importación y exportación de listas (.csv y .xlsx).
  file_picker: ^13.3.2
  csv: ^8.0.0
  excel: ^4.0.6

  # Enrolamiento local por QR del primer día.
  mobile_scanner: ^7.5.0
  qr_flutter: ^4.1.0

  # Sincronización opcional con Google Sheets (@uniguajira.edu.co).
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  http: ^1.6.0

  # Utilidades de formato e identificadores.
  intl: ^0.20.3
  uuid: ^4.6.0
  wakelock_plus: ^1.8.2
  share_plus: ^13.3.1
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Driver FFI: permite ejecutar las pruebas de SQLite en Linux sin dispositivo.
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
